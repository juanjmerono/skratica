<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skratica — Admin</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f1a;
      --accent: #7c6af7;
      --text-muted: #a0a0c4;
      --danger: #e05252;
      --danger-glow: rgba(224, 82, 82, 0.45);
      --red-color: #e05252;
      --red-glow: rgba(224, 82, 82, 0.45);
      --blue-color: #5278e0;
      --blue-glow: rgba(82, 120, 224, 0.45);
      --green-color: #52c052;
      --green-glow: rgba(82, 192, 82, 0.45);
      --yellow-color: #c8b820;
      --yellow-glow: rgba(200, 184, 32, 0.45);
    }

    body {
      background-color: var(--bg);
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 24px;
    }

    header { text-align: center; }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
    }

    header p {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* ════════════════════════════
       VISTA LOGIN
    ════════════════════════════ */
    #view-login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 320px;
      animation: fadeIn 0.5s ease forwards;
    }

    .lock-icon {
      font-size: 3rem;
      line-height: 1;
    }

    .login-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.05em;
      text-align: center;
    }

    .password-input {
      width: 100%;
      background: #1e1e32;
      border: 2px solid #3a3a5a;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      text-align: center;
      outline: none;
      letter-spacing: 0.15em;
      caret-color: var(--accent);
      transition: border-color 0.2s;
    }

    .password-input:focus { border-color: var(--accent); }

    .password-input.error {
      border-color: var(--danger);
      animation: shake 0.3s ease;
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 0;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(124,106,247,0.35);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-login:hover  { background: #6a59e0; }
    .btn-login:active { transform: translateY(1px); }

    .error-msg {
      font-size: 0.8rem;
      color: var(--danger);
      letter-spacing: 0.05em;
      text-align: center;
      min-height: 1.2em;
    }

    /* ════════════════════════════
       VISTA ACCIONES (tras login)
    ════════════════════════════ */
    #view-actions {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 320px;
      animation: fadeIn 0.5s ease forwards;
    }

    #view-actions.active { display: flex; }

    .actions-title {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 4px;
    }

    .team-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-action {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-action.small {
      padding: 10px 6px;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      border-radius: 10px;
      flex: 1;
    }

    .btn-action:hover  { opacity: 0.85; }
    .btn-action:active { transform: translateY(1px); }

    .btn-action.reset {
      background: var(--danger);
      color: #fff;
      box-shadow: 0 4px 16px var(--danger-glow);
    }

    .btn-action.team-a {
      background: var(--red-color);
      color: #fff;
      box-shadow: 0 4px 16px var(--red-glow);
    }

    .btn-action.team-b {
      background: var(--blue-color);
      color: #fff;
      box-shadow: 0 4px 16px var(--blue-glow);
    }

    .btn-action.team-c {
      background: var(--green-color);
      color: #fff;
      box-shadow: 0 4px 16px var(--green-glow);
    }

    .btn-action.team-d {
      background: var(--yellow-color);
      color: #fff;
      box-shadow: 0 4px 16px var(--yellow-glow);
    }

    .actions-divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 4px 0;
    }

    /* ════════════════════════════
       VISTA QR
    ════════════════════════════ */
    #view-qr {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.5s ease forwards;
    }

    #view-qr.active { display: flex; }

    .qr-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    .qr-box {
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      transition: box-shadow 0.3s;
      position: relative;
    }

    .qr-box.type-reset {
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 40px var(--danger-glow);
    }

    .qr-box.type-a {
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 40px var(--red-glow);
    }

    .qr-box.type-b {
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 40px var(--blue-glow);
    }

    .qr-box.type-c {
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 40px var(--green-glow);
    }

    .qr-box.type-d {
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 40px var(--yellow-glow);
    }

    #qr-code canvas, #qr-code img {
      width: 240px !important;
      height: 240px !important;
      display: block;
    }

    /* Ficha hint superpuesta en el centro del QR (igual que index.html) */
    .qr-tile-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width:  clamp(44px, 14vmin, 62px);
      height: clamp(44px, 14vmin, 62px);
      background: #f5efe0;
      border: 2px solid #e0d8c8;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25), 0 0 0 3px #fff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      pointer-events: none;
    }

    .qr-tile-hint.visible { display: flex; }

    .qr-tile-hint.team-a { border-color: #e8c4c4; background: #fdf0f0; }
    .qr-tile-hint.team-b { border-color: #c4cce8; background: #f0f3fd; }
    .qr-tile-hint.team-c { border-color: #c4e8c4; background: #f0fdf0; }
    .qr-tile-hint.team-d { border-color: #e8e0a0; background: #fdfbf0; }

    .qh-letter {
      font-family: 'Segoe UI', sans-serif;
      font-size: clamp(20px, 7vmin, 34px);
      font-weight: 900;
      color: #3a3020;
      line-height: 1;
    }

    .qh-score {
      font-size: clamp(7px, 2vmin, 10px);
      font-weight: 700;
      color: #8a7a60;
      line-height: 1;
    }

    #qr-countdown {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #c0c0d8;
      font-variant-numeric: tabular-nums;
      transition: color 0.3s;
      text-align: center;
    }

    #qr-countdown.urgent-reset  { color: var(--danger); }
    #qr-countdown.urgent-a      { color: var(--red-color); }
    #qr-countdown.urgent-b      { color: var(--blue-color); }
    #qr-countdown.urgent-c      { color: var(--green-color); }
    #qr-countdown.urgent-d      { color: var(--yellow-color); }

    .qr-note {
      font-size: 0.78rem;
      color: var(--text-muted);
      max-width: 280px;
      text-align: center;
      line-height: 1.6;
    }

    .btn-back {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid #3a3a5a;
      border-radius: 12px;
      padding: 10px 32px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .btn-back:hover { color: #fff; border-color: #6a6a8a; }

    #qr-direct-link {
      font-size: 0.78rem;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    #qr-direct-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <h1>Skratica</h1>
    <p>Administración</p>
  </header>

  <!-- ── Vista: login ── -->
  <div id="view-login">
    <div class="lock-icon">🔒</div>
    <div class="login-title">Introduce la contraseña de administrador</div>
    <input
      class="password-input"
      id="password-input"
      type="password"
      autocomplete="off"
      placeholder="••••••••"
    />
    <div class="error-msg" id="error-msg"></div>
    <button class="btn-login" id="btn-login">Acceder</button>
  </div>

  <!-- ── Vista: panel de acciones ── -->
  <div id="view-actions">
    <div class="actions-title">Generar código QR</div>

    <div class="team-row">
      <button class="btn-action small team-a" data-action="captain" data-team="A">Capitán</button>
      <button class="btn-action small team-a" data-action="tile" data-team="A">Letra</button>
      <button class="btn-action small team-a" data-action="word" data-team="A">Palabra</button>
    </div>
    <div class="team-row">
      <button class="btn-action small team-b" data-action="captain" data-team="B">Capitán</button>
      <button class="btn-action small team-b" data-action="tile" data-team="B">Letra</button>
      <button class="btn-action small team-b" data-action="word" data-team="B">Palabra</button>
    </div>
    <div class="team-row">
      <button class="btn-action small team-c" data-action="captain" data-team="C">Capitán</button>
      <button class="btn-action small team-c" data-action="tile" data-team="C">Letra</button>
      <button class="btn-action small team-c" data-action="word" data-team="C">Palabra</button>
    </div>
    <div class="team-row">
      <button class="btn-action small team-d" data-action="captain" data-team="D">Capitán</button>
      <button class="btn-action small team-d" data-action="tile" data-team="D">Letra</button>
      <button class="btn-action small team-d" data-action="word" data-team="D">Palabra</button>
    </div>

    <div class="actions-divider"></div>

    <div class="actions-title" style="margin-top:4px">Resetear partida</div>
    <div class="team-row">
      <button class="btn-action reset small" id="btn-reset-2">2 equipos</button>
      <button class="btn-action reset small" id="btn-reset-3">3 equipos</button>
      <button class="btn-action reset small" id="btn-reset-4">4 equipos</button>
    </div>
  </div>

  <!-- ── Vista: QR generado ── -->
  <div id="view-qr">
    <div class="qr-label" id="qr-label">Escanea el código</div>
    <div class="qr-box" id="qr-box">
      <div id="qr-code"></div>
      <div class="qr-tile-hint" id="qr-tile-hint">
        <span class="qh-letter" id="qh-letter"></span>
        <span class="qh-score"  id="qh-score"></span>
      </div>
    </div>
    <div id="qr-countdown"></div>
    <p class="qr-note" id="qr-note"></p>
    <a id="qr-direct-link" href="#" onclick="window.open(this.href,'skratica_preview'); return false;" rel="noopener">Abrir enlace directamente</a>
    <button class="btn-back" id="btn-back">Volver</button>
  </div>

  <script>
    // ─────────────────────────────────────────────
    // URL BASE — debe coincidir con SHARE_BASE_URL de index.html
    // ─────────────────────────────────────────────
    const SHARE_BASE_URL = 'https://juanjmerono.github.io/skratica/';

    // ─────────────────────────────────────────────
    // HASH SHA-256 de la contraseña
    // Para cambiar la contraseña, calcular sha256("nueva_clave") y actualizar aquí.
    // ─────────────────────────────────────────────
    const ADMIN_HASH = '844c46155585f412cb6ae197236ace200dd264cb5659ac9469383ba46afafd2d';
    const SESSION_KEY = 'skratica_admin_session';
    const SESSION_TTL = 30 * 60 * 1000; // 30 minutos

    function unlockAdmin() {
      document.getElementById('view-login').style.display = 'none';
      document.getElementById('view-actions').classList.add('active');
    }

    // Comprobar sesión guardada al cargar
    (function checkSavedSession() {
      try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (!raw) return;
        const { hash, ts } = JSON.parse(raw);
        if (hash === ADMIN_HASH && Date.now() - ts < SESSION_TTL) unlockAdmin();
        else localStorage.removeItem(SESSION_KEY);
      } catch { localStorage.removeItem(SESSION_KEY); }
    })();

    // ─────────────────────────────────────────────
    // LETRAS (misma configuración que index.html)
    // ─────────────────────────────────────────────
    const LETTERS = [
      { letter: 'A',  score: 1,  weight: 12 },
      { letter: 'E',  score: 1,  weight: 12 },
      { letter: 'O',  score: 1,  weight: 9  },
      { letter: 'I',  score: 1,  weight: 6  },
      { letter: 'S',  score: 1,  weight: 6  },
      { letter: 'N',  score: 1,  weight: 5  },
      { letter: 'R',  score: 1,  weight: 5  },
      { letter: 'U',  score: 1,  weight: 5  },
      { letter: 'D',  score: 2,  weight: 5  },
      { letter: 'L',  score: 1,  weight: 4  },
      { letter: 'T',  score: 1,  weight: 4  },
      { letter: 'C',  score: 3,  weight: 4  },
      { letter: 'M',  score: 3,  weight: 3  },
      { letter: 'P',  score: 3,  weight: 2  },
      { letter: 'B',  score: 3,  weight: 2  },
      { letter: 'G',  score: 2,  weight: 2  },
      { letter: 'H',  score: 4,  weight: 2  },
      { letter: 'F',  score: 4,  weight: 1  },
      { letter: 'V',  score: 4,  weight: 1  },
      { letter: 'Y',  score: 4,  weight: 1  },
      { letter: 'Q',  score: 5,  weight: 1  },
      { letter: 'J',  score: 8,  weight: 1  },
      { letter: 'Ñ',  score: 8,  weight: 1  },
      { letter: 'X',  score: 8,  weight: 1  },
      { letter: 'Z',  score: 10, weight: 1  },
    ];

    const TEAMS = {
      A: { label: 'Rojo',     color: '#e05252', qrColor: '#000000', cssVar: '--red-color',    glowVar: '--red-glow',    boxClass: 'type-a', teamClass: 'team-a', urgentClass: 'urgent-a' },
      B: { label: 'Azul',     color: '#5278e0', qrColor: '#000000', cssVar: '--blue-color',   glowVar: '--blue-glow',   boxClass: 'type-b', teamClass: 'team-b', urgentClass: 'urgent-b' },
      C: { label: 'Verde',    color: '#52c052', qrColor: '#000000', cssVar: '--green-color',  glowVar: '--green-glow',  boxClass: 'type-c', teamClass: 'team-c', urgentClass: 'urgent-c' },
      D: { label: 'Amarillo', color: '#c8b820', qrColor: '#000000', cssVar: '--yellow-color', glowVar: '--yellow-glow', boxClass: 'type-d', teamClass: 'team-d', urgentClass: 'urgent-d' },
    };

    const totalWeight = LETTERS.reduce((sum, l) => sum + l.weight, 0);

    // ─────────────────────────────────────────────
    // TIEMPO DE RED — evita diferencias de reloj entre dispositivos
    // ─────────────────────────────────────────────
    async function getNetworkTime() {
      try {
        const res = await fetch(SHARE_BASE_URL, { method: 'HEAD', cache: 'no-store' });
        const dateHeader = res.headers.get('Date');
        if (dateHeader) {
          const t = Date.parse(dateHeader);
          if (!isNaN(t)) return t;
        }
      } catch (e) {
        console.warn('[skratica] getNetworkTime falló, usando reloj local', e);
      }
      return Date.now();
    }

    function weightedRandom() {
      let rand = Math.random() * totalWeight;
      for (const entry of LETTERS) {
        rand -= entry.weight;
        if (rand <= 0) return entry;
      }
      return LETTERS[LETTERS.length - 1];
    }

    // ─────────────────────────────────────────────
    // SHA-256 con Web Crypto API nativa
    // ─────────────────────────────────────────────
    async function sha256(message) {
      const msgBuffer  = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray  = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ─────────────────────────────────────────────
    // COUNTDOWN
    // ─────────────────────────────────────────────
    let _countdownInterval = null;

    function startCountdown(expiresAt, urgentClass, onExpired) {
      const el = document.getElementById('qr-countdown');
      if (_countdownInterval) clearInterval(_countdownInterval);
      el.classList.remove('urgent-reset', 'urgent-a', 'urgent-b', 'urgent-c', 'urgent-d');

      function tick() {
        const remaining = Math.max(0, expiresAt - Date.now());
        const secs = Math.ceil(remaining / 1000);

        if (remaining <= 0) {
          el.textContent = 'Caducado';
          el.classList.add(urgentClass);
          clearInterval(_countdownInterval);
          _countdownInterval = null;
          onExpired();
          return;
        }

        el.textContent = `0:${String(secs).padStart(2, '0')}`;
        if (secs <= 10) el.classList.add(urgentClass);
        else            el.classList.remove(urgentClass);
      }

      tick();
      _countdownInterval = setInterval(tick, 500);
    }

    // ─────────────────────────────────────────────
    // MOSTRAR PANEL QR
    // ─────────────────────────────────────────────
    function showQR({ url, timestamp, colorDark, boxClass, label, note, urgentClass, badgeEntry, teamClass, letterColor }) {
      const expiresAt = timestamp + 30000;

      // Generar QR
      const el = document.getElementById('qr-code');
      el.innerHTML = '';
      new QRCode(el, {
        text:         url,
        width:        240,
        height:       240,
        colorDark:    colorDark,
        colorLight:   '#ffffff',
        correctLevel: QRCode.CorrectLevel.H,
      });

      // Configurar aspecto del panel
      const box = document.getElementById('qr-box');
      box.className = `qr-box ${boxClass}`;

      document.getElementById('qr-label').textContent = label;
      document.getElementById('qr-note').innerHTML    = note;
      document.getElementById('qr-direct-link').href  = `index.html${url.substring(url.lastIndexOf('/')+1)}`;

      // Ficha hint superpuesta en el centro del QR (solo para tiles de equipo)
      const hint = document.getElementById('qr-tile-hint');
      if (badgeEntry) {
        hint.className = `qr-tile-hint visible ${teamClass}`;
        document.getElementById('qh-letter').textContent  = badgeEntry.letter;
        document.getElementById('qh-letter').style.color  = letterColor || '#3a3020';
        document.getElementById('qh-score').textContent   = badgeEntry.score;
      } else {
        hint.className = 'qr-tile-hint';
      }

      // Mostrar vista QR
      document.getElementById('view-actions').classList.remove('active');
      document.getElementById('view-qr').classList.add('active');

      // Countdown: al caducar volver a acciones
      startCountdown(expiresAt, urgentClass, () => {
        setTimeout(backToActions, 1200);
      });
    }

    function backToActions() {
      if (_countdownInterval) { clearInterval(_countdownInterval); _countdownInterval = null; }
      document.getElementById('view-qr').classList.remove('active');
      document.getElementById('qr-countdown').classList.remove('urgent-reset', 'urgent-a', 'urgent-b', 'urgent-c', 'urgent-d');
      document.getElementById('view-actions').classList.add('active');
    }

    // ─────────────────────────────────────────────
    // GENERADORES
    // ─────────────────────────────────────────────
    async function generateResetQR(teamCount) {
      const timestamp = await getNetworkTime();
      const encoded   = btoa(`reset,${timestamp}`);
      const teamsParam = teamCount !== 4 ? `teams=${teamCount}&` : '';
      const url       = `${SHARE_BASE_URL}?${teamsParam}reset=${encoded}`;

      showQR({
        url,
        timestamp,
        colorDark:   '#000000',
        boxClass:    'type-reset',
        label:       teamCount !== 4 ? `Reset ${teamCount} equipos` : 'Reset 4 equipos',
        note:        `Reinicia la partida con <strong>${teamCount} equipo${teamCount > 1 ? 's' : ''}</strong>. Código válido <strong style="color:var(--danger)">30 segundos</strong>.`,
        urgentClass: 'urgent-reset',
        badgeEntry:  null,
        teamClass:   '',
      });
    }

    async function generateTileQR(teamKey) {
      const entry     = weightedRandom();
      const timestamp = await getNetworkTime();
      const tileId    = Math.random().toString(36).slice(2, 10);
      const encoded   = btoa(`${entry.letter},${teamKey},${timestamp},${tileId}`);
      const url      = `${SHARE_BASE_URL}?tile=${encoded}`;
      const teamConf = TEAMS[teamKey];

      showQR({
        url,
        timestamp,
        colorDark:   teamConf.qrColor,
        boxClass:    teamConf.boxClass,
        label:       `Ficha para el equipo ${teamConf.label}`,
        note:        `Este código es válido <strong style="color:var(${teamConf.cssVar})">30 segundos</strong>.<br>Solo puede escanearlo un miembro del equipo ${teamConf.label}.`,
        urgentClass: teamConf.urgentClass,
        badgeEntry:  entry,
        teamClass:   teamConf.teamClass,
        letterColor: teamConf.color,
      });
    }

    async function generateWordQR(teamKey) {
      const teamConf  = TEAMS[teamKey];
      const timestamp = await getNetworkTime();
      const word      = 'TEST';
      const score     = 10;
      const id        = Math.random().toString(36).slice(2, 10);
      const encoded   = btoa(`word,${teamKey},${word},${score},${id}`);
      const url       = `${SHARE_BASE_URL}?tile=${encoded}`;

      showQR({
        url,
        timestamp,
        colorDark:   teamConf.qrColor,
        boxClass:    teamConf.boxClass,
        label:       `Palabra validada — Equipo ${teamConf.label}`,
        note:        `Simula una palabra "<strong style="color:var(${teamConf.cssVar})">${word}</strong>" con <strong>${score} pts</strong> para el equipo ${teamConf.label}.<br>Escanéalo desde la vista del capitán.`,
        urgentClass: teamConf.urgentClass,
        badgeEntry:  null,
        teamClass:   teamConf.teamClass,
      });
    }

    async function generateCaptainQR(teamKey) {
      const teamConf  = TEAMS[teamKey];
      const timestamp = await getNetworkTime();
      const id        = Math.random().toString(36).slice(2, 10);
      const encoded   = btoa(`captain,${teamKey},${timestamp},${id}`);
      const url       = `${SHARE_BASE_URL}?tile=${encoded}`;

      showQR({
        url,
        timestamp,
        colorDark:   teamConf.qrColor,
        boxClass:    teamConf.boxClass,
        label:       `QR de capitán — Equipo ${teamConf.label}`,
        note:        `Este código identifica al capitán del equipo ${teamConf.label}.<br>Escanéalo desde la vista de introducción de otro dispositivo.`,
        urgentClass: teamConf.urgentClass,
        badgeEntry:  null,
        teamClass:   teamConf.teamClass,
      });
    }
    document.getElementById('btn-login').addEventListener('click', async () => {
      const input    = document.getElementById('password-input');
      const errorEl  = document.getElementById('error-msg');
      const password = input.value;

      if (!password) {
        errorEl.textContent = 'Introduce la contraseña.';
        return;
      }

      const hash = await sha256(password);

      if (hash !== ADMIN_HASH) {
        errorEl.textContent = 'Contraseña incorrecta.';
        input.classList.remove('error');
        void input.offsetWidth; // re-trigger animación
        input.classList.add('error');
        input.value = '';
        return;
      }

      // Login correcto: guardar sesión y mostrar panel de acciones
      errorEl.textContent = '';
      input.classList.remove('error');
      localStorage.setItem(SESSION_KEY, JSON.stringify({ hash: ADMIN_HASH, ts: Date.now() }));
      unlockAdmin();
    });

    document.getElementById('password-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-login').click();
    });

    document.getElementById('password-input').addEventListener('input', () => {
      document.getElementById('password-input').classList.remove('error');
      document.getElementById('error-msg').textContent = '';
    });

    document.getElementById('btn-reset-2').addEventListener('click', () => generateResetQR(2));
    document.getElementById('btn-reset-3').addEventListener('click', () => generateResetQR(3));
    document.getElementById('btn-reset-4').addEventListener('click', () => generateResetQR(4));
    document.getElementById('btn-back').addEventListener('click',   backToActions);

    document.getElementById('view-actions').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const { action, team } = btn.dataset;
      if (action === 'tile')    generateTileQR(team);
      if (action === 'word')    generateWordQR(team);
      if (action === 'captain') generateCaptainQR(team);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Haiku - Poemas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #0a0a0f;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow: hidden
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
            animation: scan 4s linear infinite;
            z-index: 1000;
            pointer-events: none;
            opacity: .3
        }

        @keyframes scan {
            0% { top: -3px }
            100% { top: 100vh }
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px
        }

        .card {
            border: 1px solid #00ff4133;
            padding: 24px 20px;
            width: 260px;
            text-align: center;
            line-height: 2.2;
            font-size: 1.1rem;
            text-shadow: 0 0 10px #00ff4155;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            background: #0a0a0fcc
        }

        .card:nth-child(1) { animation-delay: .2s }
        .card:nth-child(2) { animation-delay: .6s }
        .card:nth-child(3) { animation-delay: 1s }

        @keyframes fadeIn {
            to { opacity: 1 }
        }

        .card .line {
            display: block
        }

        .card .number {
            color: #00ff41;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 12px;
            display: block;
            text-shadow: 0 0 15px #00ff41
        }

        .back {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff4144;
            text-decoration: none;
            font-size: .8rem;
            letter-spacing: 2px;
            transition: all .3s
        }

        .back:hover {
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41
        }
    </style>
</head>

<body>
    <div class="scan-line"></div>
    <div class="cards">
        <div class="card">
            <span class="number">I</span>
            <span class="line">Un punto clave</span>
            <span class="line">Esconde dentro de sí</span>
            <span class="line">El gran tesoro</span>
        </div>
        <div class="card">
            <span class="number">II</span>
            <span class="line">Un versículo</span>
            <span class="line">Señala la palabra</span>
            <span class="line">Desconocida</span>
        </div>
        <div class="card">
            <span class="number">III</span>
            <span class="line">Del más reciente</span>
            <span class="line">Su tamaño señala</span>
            <span class="line">A los vetados</span>
        </div>
    </div>
    <a href="index.html" class="back">[ volver ]</a>
</body>
</html>

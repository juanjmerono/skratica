<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Haiku - Poemas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: #0a0a0f;
            color: #00ff41;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow: hidden
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff41, transparent);
            animation: scan 4s linear infinite;
            z-index: 1000;
            pointer-events: none;
            opacity: .3
        }

        @keyframes scan {
            0% { top: -3px }
            100% { top: 100vh }
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 900px
        }

        .card {
            border: 1px solid #00ff4133;
            padding: 24px 20px;
            width: 260px;
            text-align: center;
            line-height: 2.2;
            font-size: 1.1rem;
            text-shadow: 0 0 10px #00ff4155;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            background: #0a0a0fcc
        }

        .card:nth-child(1) { animation-delay: .2s }
        .card:nth-child(2) { animation-delay: .6s }
        .card:nth-child(3) { animation-delay: 1s }

        @keyframes fadeIn {
            to { opacity: 1 }
        }

        .card .line {
            display: block
        }

        .card .number {
            color: #00ff41;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 12px;
            display: block;
            text-shadow: 0 0 15px #00ff41
        }

        .back {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff4144;
            text-decoration: none;
            font-size: .8rem;
            letter-spacing: 2px;
            transition: all .3s
        }

        .back:hover {
            color: #00ff41;
            text-shadow: 0 0 10px #00ff41
        }
    </style>
</head>

<body>
    <div class="scan-line"></div>
    <div class="cards">
        <div class="card" id="c1"><span class="number">I</span></div>
        <div class="card" id="c2"><span class="number">II</span></div>
        <div class="card" id="c3"><span class="number">III</span></div>
    </div>
    <a href="index.html" class="back">[ volver ]</a>
    <script>
        const poems = [
            ['\x55\x6e\x20\x70\x75\x6e\x74\x6f\x20\x63\x6c\x61\x76\x65', '\x45\x73\x63\x6f\x6e\x64\x65\x20\x64\x65\x6e\x74\x72\x6f\x20\x64\x65\x20\x73\xed', '\x45\x6c\x20\x67\x72\x61\x6e\x20\x74\x65\x73\x6f\x72\x6f'],
            ['\x55\x6e\x20\x76\x65\x72\x73\xed\x63\x75\x6c\x6f', '\x53\x65\xf1\x61\x6c\x61\x20\x6c\x61\x20\x70\x61\x6c\x61\x62\x72\x61', '\x44\x65\x73\x63\x6f\x6e\x6f\x63\x69\x64\x61'],
            ['\x44\x65\x6c\x20\x6d\xe1\x73\x20\x72\x65\x63\x69\x65\x6e\x74\x65', '\x53\x75\x20\x74\x61\x6d\x61\xf1\x6f\x20\x73\x65\xf1\x61\x6c\x61', '\x41\x20\x6c\x6f\x73\x20\x76\x65\x74\x61\x64\x6f\x73']
        ];
        function decode(arr) {
            return arr.map(l => `<span class="line">${l}</span>`).join('');
        }
        document.getElementById('c1').innerHTML += decode(poems[0]);
        document.getElementById('c2').innerHTML += decode(poems[1]);
        document.getElementById('c3').innerHTML += decode(poems[2]);
    </script>
</body>
</html>
